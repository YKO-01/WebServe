- server:
	host:localhost
	port: 6969
	client_body_size : 1000000
	server_names: example.com , www.example.com
	root: "/Users/ael-mhar/html/"
	default_server:true
	- error_pages: 
		404 : "/error_pages/404.html"
		500 : "/error_pages/500.html"
	- router:  
		path: "/"
		default_file: index.php
		# methods: POST ,DELETE
		directory: "/Users/ael-mhar/www/"
		directory_listing: false
		useCGI: true
	- router:  
		path: "/images"
		default_file: index.html
		methods: GET, DELETE
		directory: "/tmp/images"
		directory_listing: true
		useCGI: true
	- router:
		path: "/upload"
		directory: "/Users/ael-mhar/upload/test"
		methods: POST
		upload: "/tmp/"
	- router:
		path: "/cgi"
		methods: GET,POST
		default_file: index.php
		directory: "/Users/ael-mhar/cgi/test"
		useCGI: true
	- router:  
		path: "/images/upload"
		default_file: index.html
		methods: GET,DELETE
		directory: "/tmp/images/upload"
		upload: "/tmp/images/upload"
		directory_listing: true
		useCGI: false
	- router:
		path: "/api"
		default_file: api.php
		methods: GET , POST
		directory: "/var/www/api"
		directory_listing: false
		useCGI: true
	- router:  
		path: "/about"
		default_file: about.html
		methods: POST
		directory: "/var/www/about"
		useCGI: false
